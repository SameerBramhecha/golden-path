name: Bug report
description: Report a reproducible problem in Golden Path
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Please search existing issues before submitting a new report."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Run ...\n2. Observe ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Golden Path version or commit
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version, Docker version, and relevant tooling.
